[Service]
Environment="OLLAMA_VULKAN=1"   # back to Vulkan 2026-09-20: +50% gen t/s vs ROCm on qwen3-coder:30b
Environment="ROCR_VISIBLE_DEVICES=-1"   # hide ROCm, else Ollama prefers it over Vulkan
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_MODELS=/home/ollama"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=f16"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="GGML_VK_VISIBLE_DEVICES=0"
Environment="OLLAMA_KEEP_ALIVE=-1"
ProtectHome=no
Environment="OLLAMA_CONTEXT_LENGTH=98304"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="LLAMA_ARG_CACHE_RAM=12288"   # host-RAM prompt cache (llama-server default 8192): holds ~4 agent convs at 26k; 8 GiB thrashed to 0% hits
EnvironmentFile=-/etc/ollama/cloud.env
